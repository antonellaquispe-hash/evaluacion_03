server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/bd_evento_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
